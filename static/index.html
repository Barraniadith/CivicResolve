      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) { }

                            <span>✨</span> Google Gemini AI Triage Analysis
                          </span>
                          <span className="text-indigo-300 font-semibold bg-indigo-500/20 px-2 py-0.5 rounded-full">
                            Confidence: {Math.round(complaint.ai_confidence * 100)}%
                          </span>
                        </div>
                        <div className="grid grid-cols-3 gap-2">
                          <div className="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800">
                            <span className="text-[10px] text-slate-400 block">Category</span>
                            <span className="font-semibold text-blue-300">{complaint.category}</span>
                          </div>
                          <div className="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800">
                            <span className="text-[10px] text-slate-400 block">Urgency</span>
                            <span className="font-semibold text-amber-300">{complaint.urgency} ({complaint.public_impact_score}/5)</span>
                          </div>
                          <div className="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800">
                            <span className="text-[10px] text-slate-400 block">Routing</span>
                            <span className="font-semibold text-slate-200 truncate block">{complaint.department.split("-")[0]}</span>
                          </div>
                        </div>
                        <p className="text-slate-300 bg-slate-950/70 p-3 rounded-xl leading-relaxed italic border border-slate-800">
                          "{complaint.ai_reasoning || "Standard municipal classification based on description."}"
                        </p>
                      </div>

                      {/* Citizen Resolution Rating Widget (When Resolved) */}
                      {complaint.status === "Resolved" && (
                        <div className="bg-emerald-950/40 border border-emerald-500/30 p-4 rounded-2xl space-y-2 text-xs">
                          <span className="font-bold text-emerald-300 flex items-center gap-1 text-[11px] uppercase tracking-wider">
                            <span>⭐</span> Citizen Resolution Verification & Rating
                          </span>
                          <p className="text-slate-300 text-[11px]">
                            Was this civic issue resolved to your satisfaction?
                          </p>
                          <div className="flex items-center gap-2">
                            {[1, 2, 3, 4, 5].map((star) => (
                              <button
                                key={star}
                                type="button"
                                onClick={() => setUserRating(star)}
                                className={`text-xl transition ${star <= userRating ? "text-amber-400 scale-110" : "text-slate-600 hover:text-amber-300"}`}
                              >
                                ★
                              </button>
                            ))}
                            <button
                              onClick={handleRateResolution}
                              className="ml-3 px-3 py-1 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-[11px] transition"
                            >
                              {ratedSuccess ? "Saved! ⭐" : "Submit Rating"}
                            </button>
                          </div>
                        </div>
                      )}

                      {/* Municipal Action Form */}
                      <div className="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 space-y-3 text-xs">
                        <h4 className="font-bold text-white text-xs uppercase tracking-wider">Municipal Administrative Action</h4>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="text-[10px] text-slate-400 block mb-1">Update Status</label>
                            <select
                              value={status}
                              onChange={(e) => setStatus(e.target.value)}
                              className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                            >
                              <option value="Reported">Reported</option>
                              <option value="In Progress">In Progress (Dispatched)</option>
                              <option value="Resolved">Resolved (Completed)</option>
                            </select>
                          </div>
                          <div>
                            <label className="text-[10px] text-slate-400 block mb-1">Assign Officer / Field Crew</label>
                            <input
                              type="text"
                              value={officer}
                              onChange={(e) => setOfficer(e.target.value)}
                              placeholder="e.g. Inspector R. Selvaraj (Crew #3)"
                              className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                            />
                          </div>
                        </div>

                        <div>
                          <label className="text-[10px] text-slate-400 block mb-1">Resolution / Field Notes</label>
                          <textarea
                            rows="2"
                            value={notes}
                            onChange={(e) => setNotes(e.target.value)}
                            placeholder="Details of materials used, repairs made..."
                            className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none"
                          ></textarea>
                        </div>

                        <div className="flex justify-end gap-2 pt-1">
                          <button
                            type="button"
                            onClick={onClose}
                            className="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold"
                          >
                            Cancel
                          </button>
                          <button
                            type="button"
                            onClick={handleSave}
                            disabled={isUpdating}
                            className="px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold shadow-md shadow-blue-600/30"
                          >
                            {isUpdating ? "Saving..." : "Update Grievance"}
                          </button>
                        </div>
                      </div>

                      {/* Audit Log Timeline */}
                      <div className="space-y-2 text-xs">
                        <h4 className="font-bold text-slate-400 uppercase text-[10px] tracking-wider">Immutable Audit History</h4>
                        <div className="space-y-2 max-h-36 overflow-y-auto custom-scroll pr-1">
                          {complaint.logs && complaint.logs.map((log) => (
                            <div key={log.id} className="p-2.5 rounded-xl bg-slate-900 border border-slate-800/80 flex items-start gap-2.5">
                              <span className="text-sm">📌</span>
                              <div className="flex-1">
                                <div className="flex items-center justify-between">
                                  <span className="font-semibold text-blue-300 text-[11px]">{log.action}</span>
                                  <span className="text-[10px] text-slate-500">
                                    {new Date(log.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                                  </span>
                                </div>
                                <p className="text-slate-300 text-[10px] mt-0.5">{log.details}</p>
                                <span className="text-[9px] text-slate-500">Actor: {log.actor}</span>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                  );
    }

                  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
